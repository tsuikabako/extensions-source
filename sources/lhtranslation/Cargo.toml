[package]
name = "kuro-lhtranslation"
version = "0.1.0"
edition = "2024"
publish = false

# A standalone crate: not part of any workspace, so it builds on its own.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
kuro-madara = { path = "../../lib/madara" }
wit-bindgen = "0.57.1"

[dev-dependencies]
serde_json = "1.0.151"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
