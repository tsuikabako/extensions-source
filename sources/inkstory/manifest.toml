id = "inkstory"
name = "InkStory"
description = "Manga in Russian, chapters with dates and teams"
lang = "ru"
kind = "manga"
version = 2
# The hosts the plug-in reaches through the `http` import: the site, for its server functions (behind an Anubis check the
# app clears in its hidden browser page), and the shared API, for the update feed. Covers and page images
# (static.inuko.me) load in the app, not here.
hosts = ["inkstory.net", "api.inuko.me"]
